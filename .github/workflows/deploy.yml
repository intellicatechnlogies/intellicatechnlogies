name: Django CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python manage.py test

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            PROJECT_DIR=/home/raumishkumar01/Intellica/intellicatechnlogies
            VENV_DIR=$PROJECT_DIR/venv

            cd $PROJECT_DIR
            source $VENV_DIR/bin/activate

            git pull origin main
            pip install -r requirements.txt
            python manage.py migrate
            python manage.py collectstatic --noinput

            # Fix permissions for raumi + www-data
            sudo chown -R raumi:www-data $PROJECT_DIR
            sudo chmod -R 755 $PROJECT_DIR/staticfiles

            # Ensure socket directory exists
            sudo mkdir -p /run/gunicorn
            sudo chown raumi:www-data /run/gunicorn

            # Gunicorn systemd service
            sudo tee /etc/systemd/system/gunicorn.service > /dev/null <<EOF
            [Unit]
            Description=Gunicorn daemon for Django project
            After=network.target

            [Service]
            User=raumi
            Group=www-data
            WorkingDirectory=$PROJECT_DIR
            ExecStart=$VENV_DIR/bin/gunicorn --workers 3 --bind unix:/run/gunicorn/gunicorn.sock IntellicaTechnologies.wsgi:application
            RuntimeDirectory=gunicorn
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable gunicorn
            sudo systemctl restart gunicorn

            # Nginx config
            sudo tee /etc/nginx/sites-available/intellica > /dev/null <<EOF
            server {
                server_name intellicatechnology.com www.intellicatechnology.com;

                location / {
                    proxy_pass http://unix:/run/gunicorn/gunicorn.sock;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_redirect off;
                }

                location /static/ {
                    alias $PROJECT_DIR/staticfiles/;
                }

                listen 443 ssl;
                ssl_certificate /etc/letsencrypt/live/intellicatechnology.com/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/intellicatechnology.com/privkey.pem;
                include /etc/letsencrypt/options-ssl-nginx.conf;
                ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
            }

            server {
                if (\$host = intellicatechnology.com) {
                    return 301 https://\$host\$request_uri;
                }

                listen 80;
                server_name intellicatechnology.com;
                return 404;
            }
            EOF

            sudo ln -sf /etc/nginx/sites-available/intellica /etc/nginx/sites-enabled/intellica
            sudo nginx -t
            sudo systemctl reload nginx

            # Generate new SSL each deploy
            sudo certbot --nginx -d intellicatechnology.com -d www.intellicatechnology.com --non-interactive --agree-tos -m sales@intellicatechnology.com --force-renewal
