{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Intellica Technologies</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f3f6fb; font-family: "DM Sans", "Segoe UI", sans-serif; }
      .auth-card { width: min(100%, 460px); }
      .auth-back { display: inline-flex; gap: 7px; margin-top: 17px; color: #52647f; font-size: 12px; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="auth-card">
      <div class="auth-brand-mark"><i class="bi bi-shield-lock"></i></div>
      <p class="auth-eyebrow">INTELLICA SECURE ACCESS</p>
      <h2>Welcome back</h2>
      <p class="auth-intro">Sign in to continue to your verification workspace.</p>
      {% include "login_form.html" %}
      <a class="auth-back" href="{% url 'landing' %}"><i class="bi bi-arrow-left"></i> Back to Intellica Technologies</a>
    </main>
    <script src="{% static 'js/auth.js' %}"></script>
  </body>
</html>
